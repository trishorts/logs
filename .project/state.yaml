name: logs
created: 2026-09-22
# BUILD, not INCEPTION: design/PLAN.md exists with ordered steps, src/logs_orthology/ has working
# code with 22 passing tests, and results/ holds two measured deliverables. Disk is clearly ahead
# of the old value, which is the hybrid-state rule working as intended. SURVEY was skipped - see
# skip_log.
phase: BUILD

goal: >
  Build a generic, versioned, gene-centric cross-species orthology layer that lets any
  multi-organism proteomics project join protein identifications across species (human,
  mouse, rat, and beyond) without collapsing one-to-many orthology or discarding
  accession-, gene-, and orthogroup-level resolution.

decisions:
  - date: 2026-09-22
    text: >-
      Name is "logs" - the project covers homologs, orthologs, paralogs and any other
      -logs. Peers address us as `logs`; question-ID prefix is LOGS-.
  - date: 2026-09-22
    text: >-
      Scope is GENERIC engineering, not a single study. It must serve any large
      multi-organism proteomics project; `aging` is the first consumer, not the design driver.
  - date: 2026-09-22
    text: >-
      OWNERSHIP settled with dataRepo (001-dataRepo -> 002-logs). Ours - the orthology store,
      the analysis views, protein accession -> source gene resolution, and canonical accession
      normalization. Theirs - verbatim identifier storage (their D9). Both collisions flagged
      at inception closed in our favour; dataRepo does not want accession resolution.
  - date: 2026-09-22
    text: >-
      MVP taxa CONFIRMED human 9606 / mouse 10090 / rat 10116 (user, relayed in 001-dataRepo).
      Generic framing is retained; we are not asked to narrow it, only not to need more.
  - date: 2026-09-22
    text: >-
      An orthogroup and a pairwise orthology relationship are TWO objects, not one. A group is
      a set the source's gene tree asserts; a relationship is an edge carrying relationship_type
      and confidence. A member's "role" in a group cannot carry relationship_type, because
      one2one/one2many describe a PAIR - the same gene can be one2many to mouse and one2one to
      rat in the same group. Stated to dataRepo in 002-logs §2.
  - date: 2026-09-22
    text: >-
      An orthogroup id is NOT promised stable across source releases. The honest key is
      (source, release, group_id). A release-to-release mapping is a separate, explicitly
      derived, versioned layer. Told to dataRepo because pooling across a release boundary in
      their age_effect_meta would otherwise silently mix two memberships (002-logs §3.2).
  - date: 2026-09-22
    text: >-
      SUPERSEDED 2026-09-22 by the corrected measurement below - the numbers here used the wrong
      eligible set (protein_coding only) and are ~1pt off. Kept because the shape of the finding
      is unchanged and the correction is part of the record. ORIGINAL TEXT: "MEASURED (Compara
      116, results/cardinality.md, posted as 006-logs). 76.97% of human protein-coding genes are
      a clean 1:1:1 across 9606/10090/10116. 45 more are one2one to both rodents while the
      rodents are NOT one2one with each other - clean from every pairwise angle, not clean as a
      set. 2,269 human genes (11.3%) have no ortholog in either rodent. Mouse-rat is the easy
      join at 92.57%; anything crossing to human is not. Design for 77%, not 95%."
  - date: 2026-09-22
    text: >-
      CORRECTION to 004-logs §5. Compara CANNOT separate "no ortholog exists" from "no ortholog in
      this release" - both are an absent edge and nothing says which. Refusal is decomposed
      instead by HOW FAR THE INFERENCE GOT: no_edge_in_shared_tree (tree contains target-species
      genes, no edge called), tree_lacks_target_species (nothing to compare against),
      not_in_any_tree (no call attempted), not_in_gene_set (zero for us, NON-ZERO FOR dataRepo
      since they supply external gene ids). Also: the "source declines to type it" class is EMPTY
      in release 116 - every between-species ortholog is qualified, 55% high / 45% low. Kept the
      code path and the test, because the guarantee is "empty in this release", not "impossible".
  - date: 2026-09-22
    text: >-
      TRAP, measured and now part of the reproducible pass. Ensembl's genome-specific Compara
      dumps do not overlap - they PARTITION, and each species pair lives entirely in ONE file,
      not the obvious one. ALL 23,764 human-mouse orthologies are in the MOUSE file; the human
      file has zero. The rat file has zero in-scope pairs at all. Downloading the file named after
      your species yields a complete-LOOKING result missing 100% of human-mouse. Caught only by
      reading the provider README before the data - now a standing rule (design/PLAN.md).
  - date: 2026-09-22
    text: >-
      CORRECTED 006-logs (sent, then corrected in 007-logs). The eligible set was protein_coding
      alone; Compara's protein_default trees ALSO contain IG/TR gene segments (279 human, 485
      mouse, 511 rat), so every cardinality rate was ~1pt off in the flattering direction. Clean
      1:1:1 76.97% -> 75.49%; human->mouse 87.88% -> 86.77%; no-rodent-ortholog 2,269 -> 2,539.
      The 45 look-clean-but-arent genes were unchanged - that number never depended on the
      denominator. Headline advice unchanged: design for ~75%, not 95%.
  - date: 2026-09-22
    text: >-
      MULTI-GENE RATE is 0.36% of reviewed human accessions, NOT the 6.99% our first measurement
      gave. Ensembl xref dumps reference ALT-haplotype and patch genes, so one locus counted many
      times; 1,284 of 1,354 apparent multi-gene cases were duplicates. It also manufactured a
      "human much worse than rodents" difference that does not exist - only the human dump
      references off-primary genes (3,274). All three species are ~99.2% single-gene. Genuine
      cases are tandem-duplicated families led by ALL FOUR CORE HISTONES (P62805/H4 spans 14 real
      loci) - a rare rate concentrated on proteins abundant in every run. Also: 62 reviewed human
      accessions resolve to NO primary-assembly gene, which is its own outcome, not "unresolved".
  - date: 2026-09-22
    text: >-
      REFSEQ DEFERRAL RETRACTED (007-logs). We deferred RefSeq to v3 because mzLib parses no
      NP_/XP_ FASTA header - true, and about PARSING A HEADER, not about resolving an accession we
      already hold. Ensembl ships 69,569 curated human NP_ accessions, 96.9% resolving to exactly
      one primary gene, in a 4 MB file already on disk. CAVEAT that must travel with it - for
      human RefSeq proteins the links are mostly NOT assertions - SEQUENCE_MATCH 99,149 / DIRECT
      85,611 / INFERRED_PAIR 71,549. Carry info_type on every resolved row; UniProt is far cleaner
      (159,011 DIRECT vs 17,844 SEQUENCE_MATCH).
  - date: 2026-09-22
    text: >-
