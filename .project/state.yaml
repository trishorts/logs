  - date: 2026-09-23
    text: >-
      mzLib #1337 CNBr / M-cleaving-protease limit DOCUMENTED, NOT GUARDED (Alexander-Sol review, Low).
      For a protease cutting C-terminal to Met, the residue-2 product of a Met-retained molecule has the
      same sequence and span as the Met-removed N-terminus; Protease yields one form for both, so no
      downstream code can separate them. Excluding such proteases would restore the original bug for
      them. Effect: N-terminal occupancy may be understated for CNBr-type digests. Remarks on
      StartsAfterInitiatorMethionine (815423f7) plus a non-goal line in the PR body.
