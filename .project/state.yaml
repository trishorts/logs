name: logs
created: 2026-09-22
phase: INCEPTION

goal: >
  Build a generic, versioned, gene-centric cross-species orthology layer that lets any
  multi-organism proteomics project join protein identifications across species (human,
  mouse, rat, and beyond) without collapsing one-to-many orthology or discarding
  accession-, gene-, and orthogroup-level resolution.

decisions:
  - date: 2026-09-22
    text: >-
      Name is "logs" - the project covers homologs, orthologs, paralogs and any other
      -logs. Peers address us as `logs`; question-ID prefix is LOGS-.
  - date: 2026-09-22
    text: >-
      Scope is GENERIC engineering, not a single study. It must serve any large
      multi-organism proteomics project; `aging` is the first consumer, not the design driver.
  - date: 2026-09-22
    text: >-
      OWNERSHIP settled with dataRepo (001-dataRepo -> 002-logs). Ours - the orthology store,
      the analysis views, protein accession -> source gene resolution, and canonical accession
      normalization. Theirs - verbatim identifier storage (their D9). Both collisions flagged
      at inception closed in our favour; dataRepo does not want accession resolution.
  - date: 2026-09-22
    text: >-
      MVP taxa CONFIRMED human 9606 / mouse 10090 / rat 10116 (user, relayed in 001-dataRepo).
      Generic framing is retained; we are not asked to narrow it, only not to need more.
  - date: 2026-09-22
    text: >-
      An orthogroup and a pairwise orthology relationship are TWO objects, not one. A group is
      a set the source's gene tree asserts; a relationship is an edge carrying relationship_type
      and confidence. A member's "role" in a group cannot carry relationship_type, because
      one2one/one2many describe a PAIR - the same gene can be one2many to mouse and one2one to
      rat in the same group. Stated to dataRepo in 002-logs §2.
  - date: 2026-09-22
    text: >-
      An orthogroup id is NOT promised stable across source releases. The honest key is
      (source, release, group_id). A release-to-release mapping is a separate, explicitly
      derived, versioned layer. Told to dataRepo because pooling across a release boundary in
      their age_effect_meta would otherwise silently mix two memberships (002-logs §3.2).
  - date: 2026-09-22
    text: >-
      IMPLEMENTATION HOME - LOCKED (user, accepting the oracle's split; evidence design/ORACLE.md).
      The project does not land in one place, it splits three ways.
      (a) Accession -> source gene EXTENDS mzLib: computed views over Protein.DatabaseReferences
      beside NcbiTaxonomyId (Protein.cs:273), db-type strings as consts beside :266, re-exported
      from ProteinDbLoader:54. Plus accession-string normalization in MzLibUtil\ClassExtensions.cs
      beside SplitProteinAccessions:315, and FASTA/RefSeq parity in ProteinDbLoader.
      (b) The network ID-mapping / Ensembl client is ADD-NEW in UsefulProteomicsDatabases\,
      sibling to ProteinDbRetriever.cs, following PrideArchiveClient's async + token +
      ConfigureAwait shape and the binding CI conventions (ExternalService category, 408/429/5xx
      band, HttpRequestException==skip).
      (c) The versioned relational orthology STORE stays in `logs`. mzLib has no self-managed
      on-disk database and no DB dependency outside vendor-file reading, and
      ControlledVocabulary.cs:25-27 argues against exactly this. Revisit only if the schema
      stabilizes AND a second native C# consumer appears - with the join-table-not-vocabulary
      argument in hand.
  - date: 2026-09-22
    text: >-
      CONTAMINANTS ARE LABELLED (user, 2026-09-22) and the label travels end to end.
      `Protein.IsContaminant` is set at load (ProteinDbLoader.cs:231 for FASTA,
      ProteinXmlEntry.cs:418 for XML), rides on Protein and BioPolymerGroup, and is written out
      via BioPolymerGroupTsvSchema; dataRepo already consumes it (contaminant_psms,
      contamination_psm_share). RULE: a contaminant-panel entry is NEVER mapped through orthology.
      It is not filtered out silently either - it is resolved to the explicit outcome "contaminant,
      not mapped", so "we did not look" stays distinguishable from "no ortholog exists".

gaps:
  - >-
    DECIDE (orthology source of record). Ensembl Compara primary is the working assumption;
    decide how NCBI Orthologs / Alliance / HCOP support is stored alongside without merging
    into one unqualified "truth".
  - >-
    DECIDE (multi-ENSG semantics). UniProt writes one Ensembl dbReference per transcript with the
    ENSG in a property, so a protein can carry several ENSGs. What does that mean for us? This is
    where the one-to-many principle first bites, and it is a modelling decision, not plumbing.
  - >-
    OWED to dataRepo (REQ-LOGS-4, open). Joint cardinality of Compara orthogroups across
    9606/10090/10116 - how often is a group 1:1:1, and how often not. They will design their
    cross-species join against the number, so it must be measured, not estimated. Pairwise
    cardinality is not enough; 1:1 human-mouse plus 1:1 human-rat does not imply a clean triple.
  - >-
    AWAITING dataRepo (REQ-DATAREPO-1, the one that decides our v1 scope). Is their corpus
    UniProt-XML-derived or FASTA-derived? XML means the cross-references were present at search
    time and accession->gene is mostly reading them back, no network. FASTA means only GN=
    survived and the UniProt ID Mapping API is on the critical path - a different project.
    Also REQ-DATAREPO-2 (accession namespace mix, decides whether RefSeq is v1 or v3) and
    REQ-DATAREPO-3 (does a bundle record which source database an accession came from).
  - >-
    TELL dataRepo (fold into our next message, not a message of its own): the contaminant flag we
    raised as unclaimed in 002-logs §0 already exists and travels - Protein.IsContaminant, written
    out in BioPolymerGroupTsvSchema. Our §0 framing was wrong and they should not design around its
    absence.
  - >-
    If any mzLib work proceeds - wait for mzLib PR #1336 (feat/go-terms-accessor) to merge and
    follow its pattern. It establishes the typed-view-over-DatabaseReferences idiom; writing a
    second mechanism independently is the duplication the oracle exists to prevent.

