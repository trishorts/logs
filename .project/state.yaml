  - date: 2026-09-22
    text: >-
      V1 SCOPE SET by measurement (003-dataRepo). Their corpus is 100% UniProt XML - one file,
      uniprotkb_proteome_UP000005640_AND_revi_2026_09_18.xml, identical sha256 across all 9
      datasets, MetaMorpheus 1.1.11. Zero RefSeq, zero isoform suffixes, zero _N collision
      counters, zero entrapment prefixes. So v1 reads cross-references back off the search
      database - no ID Mapping service on the critical path, no network in the hot path.
      RefSeq deferred to v3. CAVEAT recorded as an expiring measurement, not a fact: this is one
      producer running one batch, the rodent half has no data yet, and a future contributed
      dataset could be FASTA-derived. Plan for FASTA; do not pay for it in v1. A FASTA corpus
      degrades us to GN= symbols, which is a DIFFERENT QUALITY OF ANSWER, not merely less data,
      and the output must say so.
  - date: 2026-09-22
    text: >-
