name: logs
created: 2026-09-22
# BUILD, not INCEPTION: design/PLAN.md exists with ordered steps, src/logs_orthology/ has working
# code with 22 passing tests, and results/ holds two measured deliverables. Disk is clearly ahead
# of the old value, which is the hybrid-state rule working as intended. SURVEY was skipped - see
# skip_log.
phase: BUILD

goal: >
  Build a generic, versioned, gene-centric cross-species orthology layer that lets any
  multi-organism proteomics project join protein identifications across species (human,
  mouse, rat, and beyond) without collapsing one-to-many orthology or discarding
  accession-, gene-, and orthogroup-level resolution.

decisions:
  - date: 2026-09-22
    text: >-
      Name is "logs" - the project covers homologs, orthologs, paralogs and any other
      -logs. Peers address us as `logs`; question-ID prefix is LOGS-.
  - date: 2026-09-22
    text: >-
      Scope is GENERIC engineering, not a single study. It must serve any large
      multi-organism proteomics project; `aging` is the first consumer, not the design driver.
  - date: 2026-09-22
    text: >-
      OWNERSHIP settled with dataRepo (001-dataRepo -> 002-logs). Ours - the orthology store,
      the analysis views, protein accession -> source gene resolution, and canonical accession
      normalization. Theirs - verbatim identifier storage (their D9). Both collisions flagged
      at inception closed in our favour; dataRepo does not want accession resolution.
  - date: 2026-09-22
    text: >-
      MVP taxa CONFIRMED human 9606 / mouse 10090 / rat 10116 (user, relayed in 001-dataRepo).
      Generic framing is retained; we are not asked to narrow it, only not to need more.
  - date: 2026-09-22
    text: >-
      An orthogroup and a pairwise orthology relationship are TWO objects, not one. A group is
      a set the source's gene tree asserts; a relationship is an edge carrying relationship_type
      and confidence. A member's "role" in a group cannot carry relationship_type, because
      one2one/one2many describe a PAIR - the same gene can be one2many to mouse and one2one to
      rat in the same group. Stated to dataRepo in 002-logs §2.
  - date: 2026-09-22
    text: >-
      An orthogroup id is NOT promised stable across source releases. The honest key is
      (source, release, group_id). A release-to-release mapping is a separate, explicitly
      derived, versioned layer. Told to dataRepo because pooling across a release boundary in
      their age_effect_meta would otherwise silently mix two memberships (002-logs §3.2).
  - date: 2026-09-22
    text: >-
      SUPERSEDED 2026-09-22 by the corrected measurement below - the numbers here used the wrong
      eligible set (protein_coding only) and are ~1pt off. Kept because the shape of the finding
      is unchanged and the correction is part of the record. ORIGINAL TEXT: "MEASURED (Compara
      116, results/cardinality.md, posted as 006-logs). 76.97% of human protein-coding genes are
      a clean 1:1:1 across 9606/10090/10116. 45 more are one2one to both rodents while the
      rodents are NOT one2one with each other - clean from every pairwise angle, not clean as a
      set. 2,269 human genes (11.3%) have no ortholog in either rodent. Mouse-rat is the easy
      join at 92.57%; anything crossing to human is not. Design for 77%, not 95%."
  - date: 2026-09-22
    text: >-
      CORRECTION to 004-logs §5. Compara CANNOT separate "no ortholog exists" from "no ortholog in
      this release" - both are an absent edge and nothing says which. Refusal is decomposed
      instead by HOW FAR THE INFERENCE GOT: no_edge_in_shared_tree (tree contains target-species
      genes, no edge called), tree_lacks_target_species (nothing to compare against),
      not_in_any_tree (no call attempted), not_in_gene_set (zero for us, NON-ZERO FOR dataRepo
      since they supply external gene ids). Also: the "source declines to type it" class is EMPTY
      in release 116 - every between-species ortholog is qualified, 55% high / 45% low. Kept the
      code path and the test, because the guarantee is "empty in this release", not "impossible".
  - date: 2026-09-22
    text: >-
      TRAP, measured and now part of the reproducible pass. Ensembl's genome-specific Compara
      dumps do not overlap - they PARTITION, and each species pair lives entirely in ONE file,
      not the obvious one. ALL 23,764 human-mouse orthologies are in the MOUSE file; the human
      file has zero. The rat file has zero in-scope pairs at all. Downloading the file named after
      your species yields a complete-LOOKING result missing 100% of human-mouse. Caught only by
      reading the provider README before the data - now a standing rule (design/PLAN.md).
  - date: 2026-09-22
    text: >-
      CORRECTED 006-logs (sent, then corrected in 007-logs). The eligible set was protein_coding
      alone; Compara's protein_default trees ALSO contain IG/TR gene segments (279 human, 485
      mouse, 511 rat), so every cardinality rate was ~1pt off in the flattering direction. Clean
      1:1:1 76.97% -> 75.49%; human->mouse 87.88% -> 86.77%; no-rodent-ortholog 2,269 -> 2,539.
      The 45 look-clean-but-arent genes were unchanged - that number never depended on the
      denominator. Headline advice unchanged: design for ~75%, not 95%.
  - date: 2026-09-22
    text: >-
      MULTI-GENE RATE is 0.36% of reviewed human accessions, NOT the 6.99% our first measurement
      gave. Ensembl xref dumps reference ALT-haplotype and patch genes, so one locus counted many
      times; 1,284 of 1,354 apparent multi-gene cases were duplicates. It also manufactured a
      "human much worse than rodents" difference that does not exist - only the human dump
      references off-primary genes (3,274). All three species are ~99.2% single-gene. Genuine
      cases are tandem-duplicated families led by ALL FOUR CORE HISTONES (P62805/H4 spans 14 real
      loci) - a rare rate concentrated on proteins abundant in every run. Also: 62 reviewed human
      accessions resolve to NO primary-assembly gene, which is its own outcome, not "unresolved".
  - date: 2026-09-22
    text: >-
      REFSEQ DEFERRAL RETRACTED (007-logs). We deferred RefSeq to v3 because mzLib parses no
      NP_/XP_ FASTA header - true, and about PARSING A HEADER, not about resolving an accession we
      already hold. Ensembl ships 69,569 curated human NP_ accessions, 96.9% resolving to exactly
      one primary gene, in a 4 MB file already on disk. CAVEAT that must travel with it - for
      human RefSeq proteins the links are mostly NOT assertions - SEQUENCE_MATCH 99,149 / DIRECT
      85,611 / INFERRED_PAIR 71,549. Carry info_type on every resolved row; UniProt is far cleaner
      (159,011 DIRECT vs 17,844 SEQUENCE_MATCH).
  - date: 2026-09-22
    text: >-
      METHOD, made permanent after two wrong denominators in one afternoon. A DENOMINATOR IS A
      CLAIM - enumerate the reference set before dividing by it. NEVER name an entity from memory
      in a deliverable (Q5JQC4 was written up as KIR2DL5A from recall; it is CT47A1). WHEN A
      RESULT IS SURPRISING, SUSPECT THE MEASUREMENT FIRST. Read the provider README before the
      data. Rules live in design/PLAN.md; numbers already sent to a partner are pinned by
      tests/test_reported_claims.py so a re-run that moves one fails loudly instead of leaving a
      wrong number in someone else's schema.
  - date: 2026-09-22
    text: >-
      IMPLEMENTATION HOME - LOCKED (user, accepting the oracle's split; evidence design/ORACLE.md).
      The project does not land in one place, it splits three ways.
      (a) Accession -> source gene EXTENDS mzLib: computed views over Protein.DatabaseReferences
      beside NcbiTaxonomyId (Protein.cs:273), db-type strings as consts beside :266, re-exported
      from ProteinDbLoader:54. Plus accession-string normalization in MzLibUtil\ClassExtensions.cs
      beside SplitProteinAccessions:315, and FASTA/RefSeq parity in ProteinDbLoader.
      (b) The network ID-mapping / Ensembl client is ADD-NEW in UsefulProteomicsDatabases\,
      sibling to ProteinDbRetriever.cs, following PrideArchiveClient's async + token +
      ConfigureAwait shape and the binding CI conventions (ExternalService category, 408/429/5xx
      band, HttpRequestException==skip).
      (c) The versioned relational orthology STORE stays in `logs`. mzLib has no self-managed
      on-disk database and no DB dependency outside vendor-file reading, and
      ControlledVocabulary.cs:25-27 argues against exactly this. Revisit only if the schema
      stabilizes AND a second native C# consumer appears - with the join-table-not-vocabulary
      argument in hand.
  - date: 2026-09-22
    text: >-
      CONTAMINANTS ARE LABELLED (user, 2026-09-22) and the label travels end to end.
      `Protein.IsContaminant` is set at load (ProteinDbLoader.cs:231 for FASTA,
      ProteinXmlEntry.cs:418 for XML), rides on Protein and BioPolymerGroup, and is written out
      via BioPolymerGroupTsvSchema; dataRepo already consumes it (contaminant_psms,
      contamination_psm_share). RULE: a contaminant-panel entry is NEVER mapped through orthology.
      It is not filtered out silently either - it is resolved to the explicit outcome "contaminant,
      not mapped", so "we did not look" stays distinguishable from "no ortholog exists".
  - date: 2026-09-22
    text: >-
      V1 SCOPE SET by measurement (003-dataRepo). Their corpus is 100% UniProt XML - one file,
      uniprotkb_proteome_UP000005640_AND_revi_2026_09_18.xml, identical sha256 across all 9
      datasets, MetaMorpheus 1.1.11. Zero RefSeq, zero isoform suffixes, zero _N collision
      counters, zero entrapment prefixes. So v1 reads cross-references back off the search
      database - no ID Mapping service on the critical path, no network in the hot path.
      RefSeq deferred to v3. CAVEAT recorded as an expiring measurement, not a fact: this is one
      producer running one batch, the rodent half has no data yet, and a future contributed
      dataset could be FASTA-derived. Plan for FASTA; do not pay for it in v1. A FASTA corpus
      degrades us to GN= symbols, which is a DIFFERENT QUALITY OF ANSWER, not merely less data,
      and the output must say so.
  - date: 2026-09-22
    text: >-
      We claim the JOB of accession->gene resolution, not dataRepo's `Protein.gene` COLUMN. Our
      resolution reads cross-references out of the search database keyed by
      (accession, search_database_sha256), never a producer's display symbol. Consequence told to
      them in 004-logs §3: their G48 parse defect cannot propagate into our output, they should
      not race the fix on our account, and they must NOT back-fill Protein.gene from our output -
      that would make a verbatim column non-verbatim and destroy its only value. The two columns
      should be allowed to disagree; the disagreement is a QC signal.
  - date: 2026-09-22
    text: >-
      HERV-K Gag/Pol - P61571, P63128, P63135, Q69384, Q902F8 (ERVK-6/-7/-8/-9/-19/-21/-24/-25,
      HERVK_113) - adopted as our NAMED REGRESSION CASE for the protein-inference-vs-orthology
      separation. Near-identical same-species paralogs, split across many accessions, landing in
      large shared protein groups. The first time our output makes them look resolved, a test
      must fail. Found by dataRepo (003-dataRepo §4) while disproving our hypothesis.
  - date: 2026-09-22
    text: >-
      REFUSAL CLASSES are FOUR, not three (004-logs §5, answering REQ-LOGS-6). (1) no ortholog
      exists - the source looked and says none. (2) no ortholog in this release - coverage, not
      biology. (3) the source declines to type the relationship. (4) THE GENE IS NOT IN THIS
      RELEASE'S GENE SET AT ALL - no call was ever attempted. (1) and (4) both present as "no
      mouse gene" and mean opposite things; collapsing them reproduces the empty-vs-unknown defect
      dataRepo warned us about, in the exact place we would have hit it.
  - date: 2026-09-22
    text: >-
      HOW WE WORK WITH PEERS (user). Ask questions, answer questions, and state our own needs
      openly - the third is the one that gets skipped. Measured day one: four messages with
      dataRepo produced ten substantive results and only TWO were reachable by thinking harder.
      Ask the owner directly, never via a proxy. Record a disproved hypothesis in the thread
      rather than dropping it quietly. Never open an empty channel. Stated to dataRepo in
      005-logs and enacted by opening the aging channel we should have opened first.
  - date: 2026-09-22
    text: >-
      "GENERIC" IS CURRENTLY UNFALSIFIED, NOT DEMONSTRATED. Every requirement we hold comes from
      one conversation, one project, one corpus - 9 datasets, one producer, one search database,
      human only. A design validated against exactly one consumer is a design fitted to that
      consumer with a generic label on it. Stated openly to dataRepo (005-logs §2.3). No ask
      attached yet; the sibling of dataRepo's rule that a requirement written on your behalf goes
      stale is that a requirement written by a SINGLE CONSUMER looks generic and is not.

  - date: 2026-09-22
    text: >-
      PLAN REORDERED (user, after 002-aging; posted as 003-logs). Next is HUMAN-ONLY accession ->
      gene resolution in `logs` (PLAN step 5); the cross-species store is DEFERRED until a rodent
      corpus exists (REQ-AGING-2: 0 rodent deposits queued, months away). aging wants resolution
      more than orthology (REQ-AGING-4) because it replaces the producer Gene Name column behind
      the 182 ragged rows. Resolution lives HERE, not in mzLib: primary-assembly restriction and
      outcome classes need the pinned Ensembl gene set, which mzLib cannot hold. mzLib's part is
      only the typed dbReference view (still gated on #1336); any XML reader written here is a
      stopgap it replaces. Also confirmed by aging: COMPARE not pool, no conservative-by-default
      product (they own that filter), four refusal outcomes carried. Isoform normalization stays
      in scope as a column beside the verbatim accession, never a rewrite.
  - date: 2026-09-22
    text: >-
      CORRECTED 007-logs in 008-logs - three errors, one cause (pooling NP_ with XP_, and counting
      xref ROWS as accessions; the dumps are per transcript). (1) Curated human NP_ is 99.58%
      single-gene, not 96.9% - 96.90% is NP_+XP_ combined. (2) "RefSeq links mostly not assertions"
      holds for XP_ (14.1% DIRECT) but NOT NP_ (76.6% DIRECT). (3) 25,177 isoform-suffixed human
      accessions, not 35,202 (rows). Found while building the resolver. Claim (2) also reached aging
      in 003-logs and is owed a correction there. Pinned in tests/test_reported_claims.py.
  - date: 2026-09-22
    text: >-
      ACCESSION -> GENE RESOLUTION MOVES TO mzLib (user, 2026-09-22, after the oracle pass). Reverses
      only the part of today's reorder decision that said "resolution lives HERE". The whole layer -
      typed Ensembl gene view on Protein, primary-assembly restriction, the six outcomes, one row per
      (accession, gene) - is C# in mzLib. src/logs_orthology/resolve.py is now the PROTOTYPE and the
      TEST ORACLE: its reference output and its 16 contracts are what the C# must reproduce. Homes
      (oracle, smith/master @ 890036fb): Protein view + const + typed class in Proteomics/Protein,
      the #1336 idiom (EXTEND, stack on or wait for #1336); Ensembl gene-set/xref loader ADD-NEW in
      UsefulProteomicsDatabases with files OUTSIDE the DLL (ControlledVocabulary.cs:25-27 rules out
      embedding; no reference-data checksum pattern exists yet); NOT in Omics, which cannot see
      DatabaseReferences; NO group-TSV column until #1286/#1287 land. The orthology STORE is not
      covered by this decision and stays in logs unless the user says otherwise.
  - date: 2026-09-22
    text: >-
      aging 006 answered REQ-AGING-5..8. 7: the search XML hash 760984e8...a7be8838 is CONFIRMED in
      full from three places, always over the decompressed .xml (a .gz makes MetaMorpheus write a
      shared temp.xml - mzLib #1323). aging retains its own copy, so resolution is RE-DERIVABLE.
      5: zero isoform suffixes BY CONSTRUCTION - the reviewed XML carries 33,097 <isoform> elements
      inside canonical entries and no suffixed accessions; suffixes appear only if their D8 appends
      isoform sequences, which changes the hash. 6: a versioned TABLE joined on (accession,
      search_database_sha256), both versioned and stable ENSG. 8: carry UniProt's primary gene name
      from the pinned DB for the ~1,012 with no gene id; outcome stays not_in_source. Also CORRECTED
      their 002: rodents are a day away, not months - un-defers the store.
  - date: 2026-09-22
    text: >-
      OPENED mzLib #1337 (trishorts, isolated from smith/master, TDD) - ModificationOccupancyCalculator
      dropped protein N-terminal mods on Met-removed forms from both numerator and denominator, so
      N-terminal occupancy covered Met-retained N-termini only. Found by the oracle pass verifying the
      occupancy manuscript (Cruz Parrilla/Shortreed/Smith draft 2026-09-02); the manuscript's 320
      position-zero observations and its "near-quantitative" argument rest on that subset. User chose
      to fix it directly rather than route through #1286/#1287. Not logs scope; opened from here.
  - date: 2026-09-22
    text: >-
      MULTI-GENE SEMANTICS DECIDED (user, option 1): report the search XML's Ensembl links as they are
      and add ensembl_xref_agrees / ensembl_xref_info_type / ensembl_xref_sha256 to every gene row
      (EnsemblXrefTable in mzLib). On the human search DB: XML multi_gene 350, of which 281 have exactly
      one xref-agreeing gene (readthrough / novel / paralog links) and 69 are genuinely multi-gene -
      filtering agrees==true reproduces the xref view. Parity with resolve.py: 20,412/20,416 identical;
      the 4 others have no Ensembl link in the XML. 005's numbers now re-derived from committed code
      (tools/ResolveSearchDb + logs_orthology.search_db) and pinned.
  - date: 2026-09-22
    text: >-
      dataRepo 009 answered REQ-DATAREPO-4..7. 7: the XML carries the ALT trap (87.59% single-ENSG over
      their 19,879; reproduced 87.11% over all 20,416; P43628 24 ENSG / 1 GeneID); GeneID gives 0.47%
      multi. mzLib cannot filter from the XML alone - our EnsemblGeneSet input is exactly the fork's
      first branch. 4: DB retained on ONE machine only, aging's to archive - build output to stand
      alone. 5: improvement, not blocker; build complete and durable. 6: yes, mzLib half first - but it
      reaches them only if MetaMorpheus WRITES the resolved id. Also: open `go` directly (#1336 seam);
      `ptmQtl` is a second consumer on the corpus.

gaps:
  - >-
    NEXT - MetaMorpheus must write the resolution into its output for dataRepo to ever see it
    (dataRepo 009 §6). Needs its own PR once the mzLib branch is released; design the output (a
    long-format AllGeneResolutions.tsv rather than a '|'-joined column) and run /oracle MetaMorpheus.
  - >-
    OPEN a `go` channel directly (dataRepo 009 §7): our branch is stacked on their #1336 and uses its
    idiom in the same class. Concrete content: the stack, and a request to warn before force-pushing.
  - >-
    DECIDE (orthology source of record). Ensembl Compara primary is the working assumption;
    decide how NCBI Orthologs / Alliance / HCOP support is stored alongside without merging
    into one unqualified "truth".
  - >-
    UN-DEFERRED (aging 006, 2026-09-22): rodent searches start on the next batch run - 181 mouse +
    27 rat queued; mouse UP000000589 / rat UP000002494 DBs pinned, decompressed hashes to follow.
    The store (PLAN step 6). Design notes retained: Schema: Gene, ProteinAccession, OrthologyGroup, OrthologyGroupMember,
    OrthologyRelationship. Group id is OURS with Compara's ENSGT preserved beside it, keyed
    (source, release, group_id) and never promised stable across releases. Relationship rows carry
    relationship_type, is_high_confidence, goc_score, wga_coverage and both identity percentages
    verbatim. Every unresolved outcome carries its class, including "contaminant, not mapped",
    "resolves only to ALT/patch" and the four refusal classes. Carry info_type per resolved row -
    DIRECT is an assertion, SEQUENCE_MATCH and INFERRED_PAIR are not.
  - >-
    "GENERIC" IS STILL UNFALSIFIED. Every requirement we hold comes from one consumer and one
    corpus. Stated openly to dataRepo in 005-logs §2.3, no ask attached. Either find a second
    unrelated consumer or say plainly that generic is aspirational. aging's answer may change the
    picture; a second consumer would settle it.

skip_log:
  - date: 2026-09-22
    item: SURVEY (literature-review)
    reason: >-
      Went inception -> plan -> build in one day on an engineering problem whose requirements came
      from a peer project's measured corpus rather than from the literature. No literature review
      was run and none is currently planned. This is defensible for the ETL and the store, but NOT
      for any claim about orthology method: if this work is ever written up, or if we assert that
      our grouping/refusal semantics improve on prior art, the survey has to happen first. Ensembl
      Compara, OrthoFinder, Alliance/HCOP and the one-to-many handling literature are the obvious
      starting points.
  - date: 2026-09-22
    item: mzLib PR #1336 not yet merged
    reason: >-
      The accession->gene work is deliberately NOT started, pending #1336 (feat/go-terms-accessor)
      merging. It establishes the typed-view-over-DatabaseReferences idiom and writing a second
      mechanism independently is the duplication the oracle exists to prevent. Waiting is the
      decision, not an oversight.

