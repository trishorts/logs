skip_log:
  - date: 2026-09-22
    item: SURVEY (literature-review)
    reason: >-
      Went inception -> plan -> build in one day on an engineering problem whose requirements came
      from a peer project's measured corpus rather than from the literature. No literature review
      was run and none is currently planned. This is defensible for the ETL and the store, but NOT
      for any claim about orthology method: if this work is ever written up, or if we assert that
      our grouping/refusal semantics improve on prior art, the survey has to happen first. Ensembl
      Compara, OrthoFinder, Alliance/HCOP and the one-to-many handling literature are the obvious
      starting points.
  - date: 2026-09-22
    item: mzLib PR #1336 not yet merged (RESOLVED 2026-09-22 - #1336 merged; #1338 opened on master)
    reason: >-
      The accession->gene work is deliberately NOT started, pending #1336 (feat/go-terms-accessor)
      merging. It establishes the typed-view-over-DatabaseReferences idiom and writing a second
      mechanism independently is the duplication the oracle exists to prevent. Waiting is the
      decision, not an oversight.

